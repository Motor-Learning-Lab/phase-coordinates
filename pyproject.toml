[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-coordinates"
version = "0.1.0"
description = "Experimental PCA and Bayesian phase-coordinate tools for cyclic motion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "nbformat",
    "jupyter",
    "matplotlib",
]
bayes = [
    "pymc",
    "arviz",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phase_coordinates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with -m slow or deselect with -m 'not slow')",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
phase-coordinates = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
bayes = { features = ["bayes"], solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
bayes-dev = { features = ["bayes", "dev", "test-bayes"], solve-group = "default" }

[tool.pixi.feature.test.tasks]
test = "python -m pytest"

[tool.pixi.feature.test-bayes.tasks]
test-bayes = "python -m pytest"

[tool.pixi.dependencies]
matplotlib = ">=3.11.1,<4"
# Keep NumPy/SciPy on one OpenMP runtime when combined with PyMC/Numba.
libblas = { version = ">=3.9,<4", build = "*openblas" }
